[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rematch-demo"
version = "0.1.0"
description = "Patient-controlled central research screening - synthetic hackathon demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3",
  "cryptography>=44,<47", "python-dotenv>=1,<2",
  "openai>=2,<3", "pytest>=8,<10"
]

[tool.setuptools.packages.find]
include = ["rematch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
